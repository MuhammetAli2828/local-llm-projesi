<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Amasya MYO Internship Assistant</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">

<div class="login-wrapper">
  <div class="login-card">
    <div class="login-logo">
      <span class="login-icon">🎓</span>
      <div class="login-title">Amasya MYO</div>
      <div class="login-sub">Internship Application Assistant</div>
    </div>

    {% if error %}
    <div class="login-error">❌ {{ error }}</div>
    {% endif %}

    <form method="POST" action="/login" class="login-form">
      <div class="login-field">
        <label>Username</label>
        <input type="text" name="username" placeholder="ogrenci or sekreter"
               autocomplete="username" autofocus required>
      </div>
      <div class="login-field">
        <label>Password</label>
        <input type="password" name="password" placeholder="••••••••"
               autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary login-btn">Sign In →</button>
    </form>

    <div class="login-hint">
      <span>👨‍🎓 Student: <code>ogrenci / ogrenci123</code></span>
      <span>🗂️ Secretary: <code>sekreter / sekreter123</code></span>
      <span>🎓 Department Head: <code>bolum_baskani / bb2025</code></span>
    </div>
  </div>
</div>

</body>
</html>
