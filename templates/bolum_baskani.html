<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bölüm Başkanı Paneli — Amasya MYO</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  body { background: var(--gray-50); }
  .bb-wrap { max-width: 900px; margin: 0 auto; padding: 24px 16px; }
  .bb-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; flex-wrap:wrap; gap:12px; }
  .bb-title  { font-size:1.4rem; font-weight:700; color:var(--gray-800); }
  .bb-sub    { font-size:.85rem; color:var(--gray-400); margin-top:2px; }
  .bb-card   { background:#fff; border-radius:14px; border:1.5px solid var(--gray-200);
               box-shadow:0 2px 8px rgba(0,0,0,.05); margin-bottom:14px; overflow:hidden; }
  .bb-card-head { padding:14px 18px; display:flex; align-items:center; justify-content:space-between;
                  flex-wrap:wrap; gap:10px; cursor:pointer; }
  .bb-card-head:hover { background:var(--gray-50); }
  .bb-id     { font-size:.82rem; font-weight:700; color:var(--primary); background:var(--primary-light);
               padding:2px 8px; border-radius:20px; }
  .bb-name   { font-weight:700; font-size:.97rem; }
  .bb-meta   { font-size:.8rem; color:var(--gray-400); margin-top:2px; }
  .bb-body   { display:none; padding:16px 18px 18px; border-top:1.5px solid var(--gray-100); }
  .bb-body.open { display:block; }
  .bb-info-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px 20px; margin-bottom:14px; }
  .bb-info-row  { font-size:.85rem; }
  .bb-info-row strong { color:var(--gray-600); margin-right:4px; }
  .bb-ai-msg { background:var(--primary-light); border-left:3px solid var(--primary);
               padding:8px 12px; border-radius:6px; font-size:.83rem; color:var(--primary);
               margin-bottom:14px; }
  .bb-actions { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .bb-name-input { padding:7px 12px; border:1.5px solid var(--gray-200); border-radius:8px;
                   font-size:.88rem; min-width:220px; }
  .bb-empty  { text-align:center; padding:48px 20px; color:var(--gray-400); font-size:.95rem; }
  .bb-onay-badge { display:inline-flex; align-items:center; gap:6px; background:#d1fae5;
                   color:#065f46; padding:4px 12px; border-radius:20px; font-size:.82rem; font-weight:700; }
  .bb-red-badge  { display:inline-flex; align-items:center; gap:6px; background:#fee2e2;
                   color:#991b1b; padding:4px 12px; border-radius:20px; font-size:.82rem; font-weight:700; }
  .toast { position:fixed; bottom:20px; right:20px; background:#1e293b; color:#fff;
           padding:10px 18px; border-radius:10px; font-size:.88rem; display:none; z-index:999; }
  .toast.show { display:block; }
  #bekleyen-count { background:var(--primary); color:#fff; border-radius:20px;
                    padding:2px 10px; font-size:.82rem; font-weight:700; }
</style>
</head>
<body>

<div class="bb-wrap">
  <div class="bb-header">
    <div>
      <div class="bb-title">🎓 Bölüm Başkanı Paneli</div>
      <div class="bb-sub">Hoş geldiniz, <strong>{{ username }}</strong></div>
    </div>
    <div style="display:flex;gap:10px;align-items:center;">
      <span id="bekleyen-count">— bekliyor</span>
      <button class="btn btn-outline btn-sm" onclick="yukleBekleyenler()">🔄 Yenile</button>
      <a href="/logout" class="btn btn-outline btn-sm">Çıkış</a>
    </div>
  </div>

  <div id="bb-list">
    <div class="bb-empty">⏳ Yükleniyor…</div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = 'toast show';
  setTimeout(() => el.className = 'toast', 3000);
}

async function yukleBekleyenler() {
  const list = document.getElementById('bb-list');
  list.innerHTML = '<div class="bb-empty">⏳ Yükleniyor…</div>';
  try {
    const res  = await fetch('/api/bb/bekleyenler');
    const rows = await res.json();
    const cnt  = document.getElementById('bekleyen-count');
    cnt.textContent = rows.length + ' bekliyor';

    if (!rows.length) {
      list.innerHTML = '<div class="bb-empty">✅ Onay bekleyen başvuru yok.</div>';
      return;
    }

    list.innerHTML = rows.map(r => `
      <div class="bb-card" id="bbc-${r.id}">
        <div class="bb-card-head" onclick="toggleBB(${r.id})">
          <div>
            <div style="display:flex;align-items:center;gap:8px;">
              <span class="bb-id">#${r.id}</span>
              <span class="bb-name">${esc(r.ad)}</span>
              ${r.ai_karar === 'KABUL'
                ? '<span style="background:#d1fae5;color:#065f46;font-size:.74rem;font-weight:700;padding:2px 8px;border-radius:20px;">🤖 AI: Uygun</span>'
                : r.ai_karar === 'RED'
                ? '<span style="background:#fee2e2;color:#991b1b;font-size:.74rem;font-weight:700;padding:2px 8px;border-radius:20px;">🤖 AI: Dikkat</span>'
                : ''}
            </div>
            <div class="bb-meta">${esc(r.tarih)} · ${esc(r.firma)} · ${esc(r.bolum)}</div>
          </div>
          <span style="color:var(--gray-400);font-size:1.1rem;">▾</span>
        </div>
        <div class="bb-body" id="bbb-${r.id}">
          <div class="bb-info-grid">
            <div class="bb-info-row"><strong>Firma:</strong>${esc(r.firma)}</div>
            <div class="bb-info-row"><strong>Bölüm:</strong>${esc(r.bolum)}</div>
            <div class="bb-info-row"><strong>Başlangıç:</strong>${esc(r.bas)}</div>
            <div class="bb-info-row"><strong>Bitiş:</strong>${esc(r.bit)}</div>
            <div class="bb-info-row"><strong>Gün:</strong>${esc(r.gun)}</div>
          </div>
          ${r.ai_mesaj ? `<div class="bb-ai-msg">🤖 AI Notu: ${esc(r.ai_mesaj)}</div>` : ''}
          <div class="bb-actions" id="act-${r.id}">
            <input type="text" class="bb-name-input" id="bbad-${r.id}"
                   placeholder="Adınız Soyadınız" value="{{ username }}">
            <button class="btn btn-success" onclick="onayla(${r.id})">✅ Onayla (E-İmzala)</button>
            <button class="btn btn-danger" onclick="reddet(${r.id})">❌ Reddet</button>
            <a href="/api/basvuru/${r.id}/pdf" target="_blank" class="btn btn-outline btn-sm">📄 Orijinal PDF</a>
          </div>
        </div>
      </div>`
    ).join('');
  } catch(e) {
    list.innerHTML = `<div class="bb-empty">❌ Hata: ${e.message}</div>`;
  }
}

function toggleBB(id) {
  const body = document.getElementById('bbb-' + id);
  body.classList.toggle('open');
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function onayla(id) {
  const ad = document.getElementById('bbad-' + id)?.value.trim();
  if (!ad) { toast('⚠️ Adınızı girin.'); return; }
  const btn = document.querySelector(`#act-${id} .btn-success`);
  btn.disabled = true; btn.textContent = '⏳ İmzalanıyor…';
  try {
    const res  = await fetch('/api/bb/onayla', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({id, ad}),
    });
    const data = await res.json();
    if (data.ok) {
      document.getElementById('act-' + id).innerHTML = `
        <span class="bb-onay-badge">✅ Onaylandı — ${esc(data.bb_tarih)}</span>
        <a href="/api/bb/imzali-pdf/${id}" class="btn btn-primary btn-sm">📥 İmzalı PDF İndir</a>`;
      toast('✅ #' + id + ' onaylandı ve PDF imzalandı!');
    } else {
      toast('❌ ' + (data.hata || 'Hata'));
      btn.disabled = false; btn.textContent = '✅ Onayla (E-İmzala)';
    }
  } catch(e) {
    toast('❌ ' + e.message);
    btn.disabled = false; btn.textContent = '✅ Onayla (E-İmzala)';
  }
}

async function reddet(id) {
  const sebep = prompt('Red sebebi (isteğe bağlı):') || '';
  const res  = await fetch('/api/bb/reddet', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({id, sebep}),
  });
  const data = await res.json();
  if (data.ok) {
    document.getElementById('act-' + id).innerHTML =
      `<span class="bb-red-badge">❌ Reddedildi</span>`;
    toast('❌ #' + id + ' reddedildi.');
  }
}

yukleBekleyenler();
</script>
</body>
</html>
